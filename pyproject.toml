[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hmda-privacy-governance"
version = "0.1.0"
description = "Privacy-safe HMDA disclosure-risk and analytical-utility platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Cory Cooper"}]
dependencies = [
  "pandas>=2.2,<3",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<6", "ruff>=0.6,<1"]

[project.scripts]
hmda = "hmda_privacy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hmda_privacy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

