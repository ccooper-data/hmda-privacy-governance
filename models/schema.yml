version: 2

models:
  - name: stg_lar
    description: Normalized HMDA LAR slice loaded from an immutable bronze file.
    columns:
      - {name: activity_year, data_type: integer, meta: {classification: public}}
      - {name: lei, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: census_tract, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: applicant_age, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: applicant_sex, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: derived_race, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: derived_ethnicity, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: income, data_type: double, meta: {classification: sensitive}}
      - {name: loan_amount, data_type: double, meta: {classification: quasi_identifier}}
      - {name: loan_type, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: debt_to_income_ratio, data_type: varchar, meta: {classification: sensitive}}
      - {name: loan_purpose, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: occupancy_type, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: lien_status, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: derived_dwelling_category, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: action_taken, data_type: integer, meta: {classification: sensitive}}

  - name: fct_application
    description: Silver application-grain table. Never published row by row.
    columns:
      - {name: activity_year, data_type: integer, meta: {classification: public}}
      - {name: lei, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: census_tract, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: applicant_age, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: applicant_sex, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: derived_race, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: derived_ethnicity, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: income, data_type: double, meta: {classification: sensitive}}
      - {name: loan_amount, data_type: double, meta: {classification: quasi_identifier}}
      - {name: loan_type, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: debt_to_income_ratio, data_type: varchar, meta: {classification: sensitive}}
      - {name: loan_purpose, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: occupancy_type, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: lien_status, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: derived_dwelling_category, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: action_taken, data_type: integer, meta: {classification: sensitive}}
      - {name: is_denied, data_type: boolean, meta: {classification: sensitive}}

  - name: risk_cohort_counts
    description: Small-cell-suppressed aggregate cohort mart.
    columns:
      - {name: activity_year, data_type: integer, meta: {classification: public}}
      - {name: derived_race, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: derived_ethnicity, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: record_count, data_type: bigint, meta: {classification: public}}
      - {name: denial_rate, data_type: double, meta: {classification: sensitive}}

  - name: qi_profile
    description: Internal aggregate QI equivalence classes formed across the full release universe.
    columns:
      - {name: census_tract, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: applicant_age, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: applicant_sex, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: derived_race, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: derived_ethnicity, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: income, data_type: double, meta: {classification: sensitive}}
      - {name: loan_amount, data_type: double, meta: {classification: quasi_identifier}}
      - {name: loan_purpose, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: occupancy_type, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: lien_status, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: derived_dwelling_category, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: lei, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: k, data_type: bigint, meta: {classification: sensitive}}

  - name: risk_metrics_by_race
    description: Aggregate-only race and ethnicity risk after full-universe equivalence scoring.
    columns:
      - {name: equivalence_universe, data_type: varchar, meta: {classification: public}}
      - {name: derived_race, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: derived_ethnicity, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: record_count, data_type: bigint, meta: {classification: public}}
      - {name: sample_uniqueness_rate, data_type: double, meta: {classification: sensitive}}
      - {name: share_records_k_lt_5, data_type: double, meta: {classification: sensitive}}
      - {name: share_records_k_lt_10, data_type: double, meta: {classification: sensitive}}
      - {name: prosecutor_expected_match_risk, data_type: double, meta: {classification: sensitive}}

  - name: qi_profile_demographic_geo
    description: QI tier containing only demographic and tract geography fields.
    columns:
      - {name: census_tract, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: applicant_age, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: applicant_sex, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: derived_race, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: derived_ethnicity, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: k, data_type: bigint, meta: {classification: sensitive}}

  - name: qi_profile_financial_context
    description: Demographic/geographic QIs plus financial and loan-context fields, excluding LEI.
    columns:
      - {name: census_tract, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: applicant_age, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: applicant_sex, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: derived_race, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: derived_ethnicity, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: income, data_type: double, meta: {classification: sensitive}}
      - {name: loan_amount, data_type: double, meta: {classification: quasi_identifier}}
      - {name: loan_purpose, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: occupancy_type, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: lien_status, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: derived_dwelling_category, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: k, data_type: bigint, meta: {classification: sensitive}}

  - name: qi_sensitivity_by_race
    description: Aggregate risk by threat-informed QI tier and demographic cohort.
    columns:
      - {name: qi_tier, data_type: varchar, meta: {classification: public}}
      - {name: derived_race, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: derived_ethnicity, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: record_count, data_type: bigint, meta: {classification: public}}
      - {name: sample_uniqueness_rate, data_type: double, meta: {classification: sensitive}}
      - {name: share_records_k_lt_5, data_type: double, meta: {classification: sensitive}}
      - {name: prosecutor_expected_match_risk, data_type: double, meta: {classification: sensitive}}

  - name: tract_release_density
    description: Application volume per tract; not residential population density.
    columns:
      - {name: census_tract, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: application_count, data_type: bigint, meta: {classification: sensitive}}
      - {name: release_density_quintile, data_type: integer, meta: {classification: public}}

  - name: risk_by_release_density
    description: Demographic/geographic risk by HMDA application-volume quintile and cohort.
    columns:
      - {name: release_density_quintile, data_type: integer, meta: {classification: public}}
      - {name: derived_race, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: derived_ethnicity, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: record_count, data_type: bigint, meta: {classification: public}}
      - {name: sample_uniqueness_rate, data_type: double, meta: {classification: sensitive}}
      - {name: prosecutor_expected_match_risk, data_type: double, meta: {classification: sensitive}}

  - name: protection_equivalence_classes
    description: Internal class sizes across four protection configurations.
    columns:
      - {name: configuration, data_type: varchar, meta: {classification: public}}
      - {name: derived_race, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: derived_ethnicity, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: k, data_type: bigint, meta: {classification: sensitive}}

  - name: privacy_utility_frontier
    description: Aggregate risk, k5 retention, and denial-disparity detection power.
    columns:
      - {name: configuration, data_type: varchar, meta: {classification: public}}
      - {name: is_current_baseline, data_type: boolean, meta: {classification: public}}
      - {name: record_count, data_type: bigint, meta: {classification: public}}
      - {name: sample_uniqueness_rate, data_type: double, meta: {classification: sensitive}}
      - {name: prosecutor_expected_match_risk, data_type: double, meta: {classification: sensitive}}
      - {name: retained_share_k5, data_type: double, meta: {classification: public}}
      - {name: reference_n_k5, data_type: double, meta: {classification: sensitive}}
      - {name: comparison_n_k5, data_type: double, meta: {classification: sensitive}}
      - {name: utility_estimable_k5, data_type: boolean, meta: {classification: public}}
      - {name: reference_denial_rate, data_type: double, meta: {classification: sensitive}}
      - {name: minimum_detectable_disparity_points_k5, data_type: double, meta: {classification: sensitive}}

  - name: fair_lending_modeling_cohort
    description: Internal-only decision cohort retained after configuration-specific k5 suppression.
    meta: {publication: prohibited}
    columns:
      - {name: configuration, data_type: varchar, meta: {classification: internal}}
      - {name: is_black, data_type: integer, meta: {classification: sensitive}}
      - {name: is_denied, data_type: integer, meta: {classification: sensitive}}
      - {name: protected_income, data_type: double, meta: {classification: sensitive}}
      - {name: protected_loan_amount, data_type: double, meta: {classification: quasi_identifier}}
      - {name: applicant_age, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: applicant_sex, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: loan_type, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: debt_to_income_ratio, data_type: varchar, meta: {classification: sensitive}}
      - {name: loan_purpose, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: occupancy_type, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: lien_status, data_type: varchar, meta: {classification: quasi_identifier}}
      - {name: derived_dwelling_category, data_type: varchar, meta: {classification: quasi_identifier}}
